server:
  port: ${PORT:8787}
  address: ${BIND_ADDRESS:0.0.0.0}
  forward-headers-strategy: native
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: qa-kb
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/qa_kb?useSSL=false&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${KB_DB_USER:root}
    # 公开仓库不存放真实口令：通过环境变量 KB_DB_PASSWORD 注入
    password: ${KB_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 2
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
    # MySQL 必须显式启用外键检查
    connection-init-sql: "SET FOREIGN_KEY_CHECKS=ON"
  jackson:
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 22MB

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-handlers-package: com.qa.kb.persistence.type
  configuration:
    map-underscore-to-camel-case: true
    arg-name-based-constructor-auto-mapping: true
    default-statement-timeout: 15
    jdbc-type-for-null: 'NULL'

kb:
  timezone: Asia/Shanghai
  session-ttl: 12h
  upload-dir: ${KB_UPLOAD_DIR:./data/uploads}
  seed:
    enabled: ${KB_SEED:true}
    demo: ${KB_SEED_DEMO:true}
    admin-login: ${KB_ADMIN_LOGIN:admin}
    admin-name: ${KB_ADMIN_NAME:管理员}
    admin-password: ${KB_ADMIN_PASSWORD:change-me-please-1}
    demo-password: ${KB_DEMO_PASSWORD:change-me-demo-1}
  backup:
    enabled: ${KB_BACKUP_ENABLED:true}
    dir: ${KB_BACKUP_DIR:./data/backups}
    keep: ${KB_BACKUP_KEEP:14}
    # 异地副本目录（可填网络共享路径）；留空表示只保留本地备份
    offsite-dir: ${KB_BACKUP_OFFSITE_DIR:}
    cron: ${KB_BACKUP_CRON:0 30 2 * * *}
  notify:
    enabled: ${KB_NOTIFY_ENABLED:true}
    # 每日扫描周报提醒与任务逾期（秒 分 时 日 月 周）
    cron: ${KB_NOTIFY_CRON:0 0 9 * * *}
    # ---- A2 外发通知：两个通道都不配置就不启用；口令/密钥只走环境变量 ----
    email:
      # 启用条件：enabled=true 且 host 非空
      enabled: ${KB_NOTIFY_EMAIL_ENABLED:false}
      host: ${KB_NOTIFY_EMAIL_HOST:}
      port: ${KB_NOTIFY_EMAIL_PORT:587}
      username: ${KB_NOTIFY_EMAIL_USERNAME:}
      password: ${KB_NOTIFY_EMAIL_PASSWORD:}
      # 发件人，留空回落到 username
      from: ${KB_NOTIFY_EMAIL_FROM:}
      # 固定收件人（逗号分隔），与「成员」页配置了邮箱的启用成员并集投递
      to: ${KB_NOTIFY_EMAIL_TO:}
    im:
      # 启用条件：url 非空；type: wecom(企业微信) / dingtalk(钉钉) / feishu(飞书)
      url: ${KB_NOTIFY_IM_URL:}
      type: ${KB_NOTIFY_IM_TYPE:wecom}
      # 可选：钉钉加签 / 飞书签名密钥，留空不签名
      secret: ${KB_NOTIFY_IM_SECRET:}

logging:
  level:
    root: INFO
    com.qa.kb: INFO
  file:
    name: ${KB_LOG_FILE:./data/qa-kb.log}